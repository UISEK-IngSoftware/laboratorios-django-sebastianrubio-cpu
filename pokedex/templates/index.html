<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body class="bg-light text-dark">
    
    <div class="container mt-5 p-5 bg-white shadow-sm border rounded" style="max-width: 900px;">
        
        <header class="border-bottom pb-3 mb-4 text-center">
            <h1 class="h3 fw-bold text-dark">Mi Pokedex</h1>
            <p class="text-muted mb-0">Hola, este es tu primer sitio en Django</p>
        </header>

        <div class="row mt-4">
            
            <div class="col-md-6 mb-4">
                <h3 class="h5 text-secondary mb-3">Pokemons</h3>
                <ul class="list-group list-group-flush border rounded">
                    {% for pokemon in pokemons %}
                    <li class="list-group-item list-group-item-action">
                        <a href="{% url 'pokemon' id=pokemon.id %}" class="text-decoration-none text-dark d-block">
                            {{ pokemon | capfirst }}
                        </a> 
                    </li>
                    {% endfor %}
                </ul>
            </div>
            
            <div class="col-md-6 mb-4">
                <h3 class="h5 text-secondary mb-3">Trainers</h3>
                <ul class="list-group list-group-flush border rounded">
                    {% for trainer in trainers %}
                    <li class="list-group-item list-group-item-action">
                        <a href="{% url 'trainer' id=trainer.id %}" class="text-decoration-none text-dark d-block">
                            {{ trainer | capfirst }}
                        </a>
                    </li>
                    {% endfor %}
                </ul>
            </div>

        </div>
    </div>

</body>
</html>
